include:
  - project: 'ci-cd/semantic-release'
    ref: main
    file: 'semantic-release.yml'

  - project: 'ci-cd/magento-module'
    ref: master
    file: 'codeception-ci.yml'

  - project: 'ci-cd/magento-module'
    ref: master
    file: 'codequality-ci.yml'

  - project: 'ci-cd/tweakwise'
    ref: main
    file: 'github-release.yml'

  - project: 'ci-cd/tweakwise'
    ref: main
    file: 'demo-pipeline-trigger.yml'

variables:
  MAGENTO_PHP_VERSION: '8.1'

magento-module/prepare/dev:
  script:
    - sed -i "s|HYVA_PACKAGIST_ORG_TOKEN|$HYVA_PACKAGIST_ORG_TOKEN|" composer.json
    - !reference [.composer.install, script]

magento-module/test/functional:
  variables:
    MIN_PHP_VERSION: '8.1'
    MIN_MAGENTO_VERSION: 2.4.7
    DISABLE_DEPENDENCY_AUDIT: "true"

release:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success
    - when: never
